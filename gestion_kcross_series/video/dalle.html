<!DOCTYPE html>

<head>

<title>KCross - Dalle</title>
<link rel="icon" type="image/png" sizes="64x64" href="../favicons/favicon-64x64.png">
<link rel="stylesheet" href="css/dalle.css?v=6">

<body>
<!--
  Dalles LED extérieures (ADJ EVS3, 4 dalles de 128 x 128 en largeur), pour le
  kayak cross : l'équivalent de ws_live/canoe/tv_dalle.html. Page autonome,
  elle suit la course d'après l'état des séries (api_get_next_heats), comme
  ecran_tv.html.

    - à gauche : le tour, Dames / Hommes, la série ;
    - une ligne par couloir : sa couleur, le nom, les zones du parcours en
      cases (vert sans pénalité, jaune FLT, rouge RAL), ordre d'arrivée ;
    - à la fin : le classement de la série, qualifiés en vert, podium en
      finale ; il reste ?maintien=20 secondes, puis la série suivante.

  Paramètres : competition (obligatoire), zone=512x128+0+0 (zone exacte
  prélevée par le contrôleur NovaStar), copies=2 (rangées de dalles qui
  montrent la même chose, empilées), maintien=20.
-->
<script type="module" src="js/dalle.js?v=6"></script>
</body>
</html>
