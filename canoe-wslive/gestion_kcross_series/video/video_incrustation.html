<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8><meta http-equiv=Cache-Control content="no-cache, no-store, must-revalidate"><meta http-equiv=Pragma content=no-cache><meta http-equiv=Expires content=0><meta name=viewport content="width=device-width, initial-scale=1.0"><title>KCross - Sortie Vidéo OBS</title><link rel=icon type=image/png sizes=64x64 href=../favicons/favicon-64x64.png><link rel=stylesheet href="../css/dossards.css?v=2.2.0"><style>.kx-club{display:none}#bracket-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none;z-index:10}</style><link id=style-link rel=stylesheet href="css/incrustation.css?v=2.2.0"></head><body><div id=ramp-container class="overlay-base hidden"><div class=title-bar id=ramp-title></div><div class=names-bar id=ramp-names></div></div><div id=live-container class="overlay-base hidden"><div class="live-next-heat hidden" id=live-next-heat></div><div class=live-title id=live-title></div><div class=live-list id=live-names></div></div><div id=results-container class="overlay-base hidden"><div class=results-header><div class=results-label id=results-label></div><div class=results-info id=results-info></div></div><div class=results-list id=results-list></div></div><script>const delay=1000;const urlParams=new URLSearchParams(window.location.search);const competitionCode=urlParams.get('competition');let currentStateStr="";let currentHeatId=null;async function fetchOverlayState(){if(!competitionCode)return;try{const response=await fetch(`../api/api_overlay_state.php?competition=${competitionCode}`);const stateStr=await response.text();if(stateStr!==currentStateStr){currentStateStr=stateStr;renderOverlay(JSON.parse(stateStr));}}catch(e){}}
function renderOverlay(state){const g=String(state.categoryKey||state.title||'').toUpperCase().match(/^X?[KC]\d([DFH])/);if(g)document.body.dataset.genre=g[1]==='H'?'hommes':'dames';else delete document.body.dataset.genre;const rampContainer=document.getElementById('ramp-container');const liveContainer=document.getElementById('live-container');const resultsContainer=document.getElementById('results-container');const prioLetters=['R','V','B','J'];if(state.styleSheet){const link=document.getElementById('style-link');const newHref=`css/${state.styleSheet}`;if(link.getAttribute('href')!==newHref){link.onload=()=>{currentStateStr='';fetchOverlayState();};link.setAttribute('href',newHref);}}
if(state.title!==currentHeatId){document.getElementById('live-names').innerHTML='';currentHeatId=state.title;}
rampContainer.className=`overlay-base ${state.mode === 'START_RAMP' ? 'visible' : 'hidden'}`;liveContainer.className=`overlay-base ${state.mode === 'LIVE_RUN' ? 'visible' : 'hidden'} ${state.showNextHeat ? 'centered-layout' : ''}`;resultsContainer.className=`overlay-base ${state.mode === 'RESULTS' ? 'visible' : 'hidden'}`;if(state.mode==='START_RAMP'){document.getElementById('ramp-title').textContent=state.title;const el=document.getElementById('ramp-names');el.innerHTML='';state.slots.forEach(s=>{const d=document.createElement('div');d.className='ramp-slot';if(s.colorLetter)d.style.borderBottomColor=`var(--color-${s.colorLetter})`;const span=document.createElement('span');span.textContent=s.name||'';d.appendChild(span);if(s.club){const c=document.createElement('small');c.className='kx-club ramp-club';c.textContent=s.club;d.appendChild(c);}el.appendChild(d);});}
else if(state.mode==='LIVE_RUN'){document.getElementById('live-title').textContent=state.title;const nextHeatEl=document.getElementById('live-next-heat');if(nextHeatEl){nextHeatEl.textContent=state.nextHeatLabel;nextHeatEl.className=`live-next-heat ${state.showNextHeat ? 'visible' : 'hidden'}`;}
const listEl=document.getElementById('live-names');const rowHeight=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--live-row-height'))+4;state.slots.forEach((slot,index)=>{if(!slot.name)return;let row=document.getElementById(`live-row-${slot.numPos}`);if(!row){row=document.createElement('div');row.id=`live-row-${slot.numPos}`;row.className='live-row';listEl.appendChild(row);}
const avant=Number(row.dataset.idx);row.style.zIndex=!isNaN(avant)&&index<avant?'2':'1';row.dataset.idx=index;row.style.transform=`translateY(${index * rowHeight}px)`;const penHtml=state.showPenalties?(slot.penaltyHtml||''):'';row.innerHTML=`
                        <div class="live-color-indicator" data-color="${prioLetters[slot.numPos]}"></div>
                        <div class="live-name">${slot.name}${slot.club?`<span class="kx-club live-club">${slot.club}</span>`:''}</div>
                        ${penHtml}
                    `;});const activeColors=state.slots.filter(s=>s.name).map(s=>`live-row-${s.numPos}`);Array.from(listEl.children).forEach(child=>{if(!activeColors.includes(child.id))child.remove();});}
else if(state.mode==='RESULTS'){document.getElementById('results-label').textContent=state.resultsLabel||'RÉSULTATS';document.getElementById('results-info').textContent=state.title;const el=document.getElementById('results-list');el.innerHTML='';state.slots.forEach(s=>{const r=document.createElement('div');r.className='results-row';const penHtml=state.showResultPenalties?(s.penaltyHtml||''):'';let qualifHtml='';if(state.showQualifiers){if((parseInt(s.rank)===1||parseInt(s.rank)===2))
qualifHtml=`<div class="qualif-tag"></div>`;else
qualifHtml='<div class="no-qualif-tag"></div>';}
let rang=Number(s.rank)>0?s.rank:"";;r.innerHTML=`
                        <div class="results-rank">${rang}</div>
                        <div class="results-color-bar" data-color="${prioLetters[s.numPos]}"></div>
                        <div class="results-name">${s.name}${s.club?`<span class="kx-club results-club">${s.club}</span>`:''}</div>
                        ${penHtml}
                        ${qualifHtml}
                    `;el.appendChild(r);});}}
if(competitionCode){const f=document.createElement('iframe');f.id='bracket-frame';f.src=`video_tableau.html?competition=${encodeURIComponent(competitionCode)}`;document.body.appendChild(f);}
function fitScreen(){const k=Math.min(innerWidth/1920,innerHeight/1080);document.body.style.transformOrigin='0 0';document.body.style.transform=Math.abs(k-1)>0.001?`scale(${k})`:'';}fitScreen();addEventListener('resize',fitScreen);
fetchOverlayState();setInterval(fetchOverlayState,delay);</script></body></html>
