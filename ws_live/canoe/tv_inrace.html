<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<title>TV inrace</title>

	<link rel="shortcut icon" href="./16x16_ffck.png" />
	<link rel="icon" href="./16x16_ffck.png"/>

	<link href="./css/tv_inrace.css?v5" rel="stylesheet">
</head>

<!--
	Incrustation du bateau suivi, 1920 x 1080, fond transparent.
	  - en bas à gauche : identité (dossard, nom, club, catégorie) ;
	  - en bas à droite : chrono tournant, temps intermédiaire, leader ;
	  - bord droit : pénalités au fil des portes jugées (slalom) ;
	  - à l'arrivée : identité + écart, temps et place.
-->
<body>
	<div id="block_start" style="display:none">
		<div class="ident">
			<div class="bib">99</div>
			<div class="who">
				<div class="name">Name</div>
				<div class="sub"><span class="club"></span><span class="categ">Categ</span></div>
			</div>
		</div>
	</div>

	<div id="block_running" style="display:none">
		<div class="pave">
			<div class="time">0,00</div>
			<div class="runner"></div>
		</div>
	</div>

	<div id="block_leader" style="display:none">
		<div class="bar">
			<span class="label">Leader</span>
			<span class="name">P.ABCDEFGHIJK</span>
			<span class="time">1:59.99</span>
		</div>
	</div>

	<div id="block_inter" class="red" style="display:none">
		<div class="leader">
			<span class="label">Leader</span>
			<span class="leader_name">P.ABCDEFGHIJK</span>
			<span class="leader_time">1:59.99</span>
		</div>
		<div class="row">
			<div class="badge">New leader</div>
			<div class="label">Inter</div>
			<div class="diff">+99.99</div>
			<div class="pave">
				<div class="time">1:59.99</div>
				<div class="live"></div>
			</div>
		</div>
	</div>

	<div id="block_finish" style="display:none">
		<div class="ident">
			<div class="bib">99</div>
			<div class="who">
				<div class="name">Name</div>
				<div class="sub"><span class="club"></span><span class="categ">Categ</span></div>
			</div>
		</div>
		<div class="result">
			<div class="label">Arrivée</div>
			<div class="diff">+99.99</div>
			<div class="time">1:59.99</div>
			<div class="rank">999</div>
		</div>
	</div>

	<div id="block_pena" style="display:none">
		<div class="pena-list"></div>
	</div>

	<script src="../bootstrap-5.0.1/js/bootstrap.min.js"></script>
	<script src="../adv/ws_params.js"></script>
	<script src="../adv/ws.js?v4"></script>
	<script src="../adv/adv.js"></script>
	<script src="../adv/adv_table.js"></script>
	<script src="../adv/canoe.js"></script>

	<script src="./js/tv_order.js?v1"></script>
	<script src="./js/tv_inrace.js?v7"></script>

	<script>document.addEventListener('DOMContentLoaded', function() {Init();})</script>
</body>
</html>
