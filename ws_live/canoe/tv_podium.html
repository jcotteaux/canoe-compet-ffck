<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<title>TV podium</title>

	<link rel="shortcut icon" href="./16x16_ffck.png" />
	<link rel="icon" href="./16x16_ffck.png"/>

	<link href="./css/tv_podium.css?v1" rel="stylesheet">
</head>

<body>
	<div id="podium" class="cache">
		<div id="podium_scrim"></div>

		<div id="podium_inner">
			<div id="podium_categ"></div>

			<div id="podium_steps">
				<!-- ordre visuel des marches : 2 - 1 - 3 -->
				<div class="step step2" id="step_2">
					<div class="card">
						<div class="ident"><span class="bib"></span><span class="name"></span></div>
						<div class="time"></div>
					</div>
					<div class="block"><span class="place">2</span></div>
				</div>

				<div class="step step1" id="step_1">
					<div class="card">
						<div class="ident"><span class="bib"></span><span class="name"></span></div>
						<div class="time"></div>
					</div>
					<div class="block"><span class="place">1</span><span class="shine"></span></div>
				</div>

				<div class="step step3" id="step_3">
					<div class="card">
						<div class="ident"><span class="bib"></span><span class="name"></span></div>
						<div class="time"></div>
					</div>
					<div class="block"><span class="place">3</span></div>
				</div>
			</div>
		</div>
	</div>

	<script src="../adv/ws_params.js"></script>
	<script src="../adv/ws.js?v2"></script>
	<script src="../adv/adv.js"></script>
	<script src="../adv/canoe.js"></script>

	<script src="./js/tv_podium.js?v1"></script>

	<script>document.addEventListener('DOMContentLoaded', function() {Init();})</script>
</body>
</html>
