<h1>PDF indisponible</h1>
<p>La commande <code>&lt;pdf&gt;</code> est servie par le bouchon, mais la génération
des documents est faite par competFFCK lui-même : il n'y a rien à produire ici.</p>
<p>Cette page existe pour que le bouton PDF de <code>live.html</code> ait une
destination valide au lieu d'ouvrir un 404.</p>
